# Seed vehicle catalogue for the cars module (spec 022 R9): the owner's
# starting list. Specs are PLACEHOLDERS flagged estimate until the Vegvesen
# lookup and NAF El Prix figures replace them. Money in NOK; the bundle
# builder converts to øre. `segment` is the market model's pooling key.
as_of: 2026-10-31
defaults:
  winter_factor: {value: 1.25, source: "Placeholder winter uplift", status: estimate, basis: "NAF El Prix winter tests to confirm per model"}
  tyre_life_km: {value: 37000, source: "OFV Kostnader ved bilhold 2026 (tyre life assumption incl. summer and winter sets)", status: estimate, basis: "OFV calculation assumption, not measured per model"}
  # Scheduled service (spec 024 R1): interval in months and km (0 km = months only),
  # price per visit. Brand pages read 2026-11-02; prices are estimates unless the
  # importer publishes them (Kia, Peugeot).
  service_interval_months: 24
  service_interval_km: 30000
  service_first_months: 0
  service_price_nok: {value: 5000, source: "Bertel O. Steen: typical EV main service 2 490-8 990 kr (2026)", status: estimate, basis: "Mid of the published dealer range; brand price not published"}
  wear_per_year_nok: {value: 1200, source: "BEMA/mekke 2025 parts list (wipers 505-825, cabin filter 242-790, 12 V battery 954-1 281 kr ex VAT) plus workshop labour; brake fluid 1 490 kr every 2 yr (BOS)", status: estimate, basis: "Wipers yearly, cabin filter every 2 yr, brake fluid every 2-4 yr, 12 V battery every 5-6 yr, incl. VAT and fitting"}
