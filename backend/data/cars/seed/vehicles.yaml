    make: Tesla
    model: Model 3
    trim_group: RWD
    segment: ev-mid
    model_years: [2021, 2022, 2023]
    drive: rwd
    body: sedan
    battery_kwh: 60
    power_kw: 208
    heat_pump: true
    auto_precondition: true
    tyre_size: 235/45 R18
    range_km_wltp: 491
    accel_0_100_s: 6.1
    efficiency_wh_per_km: {value: 150, source: "Placeholder", status: estimate, basis: "Real-world mild-weather use; NAF El Prix to confirm"}
    tyre_set_nok: {value: 12000, source: "Placeholder", status: estimate, basis: "Winter set on rims, 18 in"}
