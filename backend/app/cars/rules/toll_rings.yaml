# Toll rings by municipality, electric passenger car (rate group 1), spec 024 R5.
# Rates in NOK per passage as published by the toll company; `effective_from`
# is the date on the page. The engine blends off-peak and rush 50/50 and
# flags the item Estimate (see rules/loader.py). Read on 2026-11-02.
as_of: 2026-11-02
rings:
  - id: oslo
    municipalities: [Oslo, Bærum]
    name: "Oslo toll ring (Fjellinjen), electric car"
    offpeak_nok: 21
    rush_nok: 26
    monthly_cap_passages: 120
    effective_from: 2026-01-01
    source_url: https://www.fjellinjen.no/en/tariffs-and-toll-stations
    status: live
    note: >-
      Same rate at all stations and rings; rush 06:30-09:00 and 15:00-17:00 on
      weekdays. The page does not say whether the listed prices are before or
      after the 20 % AutoPASS agreement discount. Monthly cap 120 passages on
      Osloringen + Indre ring with AutoPASS.
