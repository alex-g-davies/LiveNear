# Norwegian car tax rules used by the cost engine (spec 022 R6).
#
# The ONLY place these numbers live. Each rule has an effective window
# [effective_from, effective_to) and a source URL. `status`:
#   live        value checked against the cited official source on `checked_on`
#   estimate    a modelled or rounded value, flagged Estimate in results
#   unverified  placeholder awaiting a check against the official page; the
#               engine treats it as an estimate so every result that uses it
#               shows Estimate until it is verified (build spec: no silent
#               defaults, don't invent data).
#
# Amounts are øre (1 NOK = 100 øre).

rules:
  # --- Trafikkforsikringsavgift: a daily tax collected with the insurance --
  # Rates apply to policies starting or renewing from 1 March of the year
  # (Skatteetaten). Petrol, hybrid and diesel cars with a factory particle
  # filter pay the ordinary "bil under 7 500 kg" rate (029 R3); every fuel
  # car in the catalogue has a particle filter.
  - id: traffic_tax_2025
    kind: traffic_insurance_tax
    effective_from: 2025-03-01
    effective_to: 2026-03-01
    params:            # øre per day by energy type
      ev: 896
      phev: 638
      hybrid: 638
      ice: 638
    source_url: https://www.skatteetaten.no/satser/trafikkforsikringsavgift/
    status: live
    checked_on: 2026-11-13
    note: >-
      Electric car 8.96 kr/day, other passenger cars under 7 500 kg 6.38 kr/day
      (diesel without a particle filter 7.93) for 1 Mar 2025 - 28 Feb 2026, read
      on the Skatteetaten rate table 2026-11-13. The page does not name hybrids;
      they are read as ordinary passenger cars.
  - id: traffic_tax_2026
    kind: traffic_insurance_tax
    effective_from: 2026-03-01
    effective_to: null
    params:
      ev: 916
      phev: 652
      hybrid: 652
      ice: 652
    source_url: https://www.skatteetaten.no/satser/trafikkforsikringsavgift/
    status: live
    checked_on: 2026-11-13
    note: >-
      Electric car 9.16 kr/day, other passenger cars under 7 500 kg 6.52 kr/day
      (diesel without a particle filter 8.10) for policies from 1 Mar 2026.
      The page does not name hybrids; they are read as ordinary passenger cars.
      The 2027 proposal (9.41) is listed under `pending`.

  # --- Omregistreringsavgift: paid by the buyer of a used car ---------------
  - id: re_registration_2025
    kind: re_registration_fee
    effective_from: 2025-01-01
    effective_to: 2026-01-01
    params:
      # Passenger cars over 1 200 kg own weight; bands by vehicle age in whole
      # years at purchase (registered 2022-2025, 2014-2021, 2013 and older).
      age_bands_ore:
        - {min_years: 0, ore: 734300}
        - {min_years: 4, ore: 443400}
        - {min_years: 12, ore: 190000}
      # Own weight up to 1 200 kg (029 R3).
      light_max_kg: 1200
      light_age_bands_ore:
        - {min_years: 0, ore: 481200}
        - {min_years: 4, ore: 316600}
        - {min_years: 12, ore: 190000}
      ev_factor: "1"
    source_url: https://www.skatteetaten.no/satser/omregistreringsavgift/
    status: live
    checked_on: 2026-11-13
    note: >-
      2025 table read on the Skatteetaten page (?year=2025) on 2026-11-13. The
      table has no fuel split.
  - id: re_registration_2026
    kind: re_registration_fee
    effective_from: 2026-01-01
    effective_to: null
    params:
      # Passenger cars over 1 200 kg (every EV in the catalogue). Skatteetaten
      # bands by first-registration year; mapped to age bands for 2026:
      # registered 2023-2026 (0-3 years) 7 505 kr, 2015-2022 (4-11 years)
      # 4 532 kr, 2014 and older (12+ years) 1 942 kr. Electric cars pay the
      # same table (exemption repealed 1 Jul 2022).
      age_bands_ore:
        - {min_years: 0, ore: 750500}
        - {min_years: 4, ore: 453200}
        - {min_years: 12, ore: 194200}
      # Own weight up to 1 200 kg (029 R3): 4 918 / 3 236 / 1 942 kr.
      light_max_kg: 1200
      light_age_bands_ore:
        - {min_years: 0, ore: 491800}
        - {min_years: 4, ore: 323600}
        - {min_years: 12, ore: 194200}
      ev_factor: "1"
    source_url: https://www.skatteetaten.no/satser/omregistreringsavgift/
    status: live
    checked_on: 2026-11-13
    note: >-
      2026 table read on 2026-11-02, weight bands on 2026-11-13; no fuel split. The age-band mapping is exact for 2026
      and drifts by one year for later start dates until the 2027 table is
      added.

  # --- Periodisk kjøretøykontroll (EU-kontroll): not a tax, but a dated legal
  # cycle the engine books a fee against (spec 024 R3) ------------------------
  - id: periodic_inspection_m1
    kind: periodic_inspection
    effective_from: 2020-01-01
    effective_to: null
    params:
      first_after_months: 48
      every_months: 24
    source_url: https://www.vegvesen.no/kjoretoy/eie-og-vedlikeholde/eu-kontroll/nar-kan-du-ta-eu-kontroll/
    status: live
    checked_on: 2026-11-02
    note: >-
      Passenger cars (M1) must pass within four years of first registration and
      then at the latest every second year. The fee itself is a market price, shown as the
      inspection fee input.

  # --- VAT on new electric cars --------------------------------------------
  - id: ev_vat_2023
    kind: ev_vat
    effective_from: 2023-01-01
    effective_to: null
    params:
      rate_pct: 25
      threshold_ore: 50000000   # 25 % VAT on the part of the price above 500 000 NOK
    source_url: https://www.skatteetaten.no/bedrift-og-organisasjon/avgifter/mva/kjop-og-salg-av-elbil/
    status: live
    checked_on: 2026-10-31
    note: >-
      From 1 January 2023 the VAT exemption for electric cars applies to the
      first 500 000 NOK of the purchase price; 25 % VAT applies above it.

# Reported but NOT applied until an official source is cited (spec 022 R6).
pending:
  - id: ev_vat_2027_proposed
    kind: ev_vat
    effective_from: 2027-01-01
    params:
      rate_pct: 25
      threshold_ore: 15000000
    source_url: ""
    status: unverified
    note: >-
      A single secondary source reports the EV VAT threshold dropping to
      150 000 NOK from 1 January 2027. Not encoded as a rule until the state
      budget text or Skatteetaten page is cited here.
